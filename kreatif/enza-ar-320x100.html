<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=320,height=100">
<title>Enza Home AR 320x100</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 320px; height: 100px; overflow: hidden; }
  a { display: flex; align-items: center; gap: 10px; position: relative;
      width: 320px; height: 100px; padding: 0 12px;
      background: linear-gradient(135deg, #f4f1ec, #e7e2d9);
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      color: #16161a; text-decoration: none; }
  img { height: 84px; flex: none; }
  .marka { font-size: 10px; letter-spacing: .22em; font-weight: 300; }
  .marka b { font-weight: 700; }
  h4 { font-size: 13px; margin: 2px 0 3px; font-weight: 600; }
  p { font-size: 10px; line-height: 1.3; color: #555; margin: 0 0 6px; }
  .cta { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
         background: #16161a; color: #fff; border-radius: 999px;
         font-size: 10.5px; font-weight: 600; padding: 6px 10px; }
  .nokta { width: 5px; height: 5px; border-radius: 50%; background: #6ee7a8;
           animation: n 2s infinite; }
  @keyframes n { 0%,100% { box-shadow: 0 0 0 0 rgba(110,231,168,.6); }
                 50% { box-shadow: 0 0 0 6px rgba(110,231,168,0); } }
</style>
</head>
<body>
<a id="tik" href="#">
  <img src="https://deneme.ink/assets/products/demo3d-1.png" alt="ATELIER">
  <div>
    <div class="marka">ENZA<b>HOME</b></div>
    <h4>ATELIER</h4>
    <p>Gerçek 3D · gerçek ölçü — odanda gör</p>
    <span class="cta"><span class="nokta"></span>Odanda Dene</span>
  </div>
</a>
<script>
  var clickTag = window.clickTag || "https://deneme.ink/uygulama.html?urun=DEMO3D";
  document.getElementById("tik").addEventListener("click", function (e) {
    e.preventDefault();
    window.open(window.clickTag || clickTag, "_blank");
  });
</script>
</body>
</html>
