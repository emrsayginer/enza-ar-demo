<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<title>Enza Home AR 300x250</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 300px; height: 250px; overflow: hidden; }
  a { display: block; position: relative; width: 300px; height: 250px;
      background: linear-gradient(135deg, #f4f1ec, #e7e2d9);
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      color: #16161a; text-decoration: none; }
  .metin { position: absolute; left: 16px; top: 16px; width: 150px; }
  .marka { font-size: 10px; letter-spacing: .22em; font-weight: 300; }
  .marka b { font-weight: 700; }
  h4 { font-size: 17px; margin: 8px 0 4px; font-weight: 600; }
  p { font-size: 11.5px; line-height: 1.45; color: #555; margin-bottom: 10px; }
  img { position: absolute; right: -26px; bottom: -6px; width: 230px; }
  .cta { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
         background: #16161a; color: #fff; border-radius: 999px;
         font-size: 12px; font-weight: 600; padding: 9px 14px; }
  .nokta { width: 6px; height: 6px; border-radius: 50%; background: #6ee7a8;
           animation: n 2s infinite; }
  @keyframes n { 0%,100% { box-shadow: 0 0 0 0 rgba(110,231,168,.6); }
                 50% { box-shadow: 0 0 0 7px rgba(110,231,168,0); } }
</style>
</head>
<body>
<a id="tik" href="#">
  <div class="metin">
    <div class="marka">ENZA<b>HOME</b></div>
    <h4>SOHO Berjer</h4>
    <p>Köşene sığar mı? Satın almadan kendi odanda gör.</p>
    <span class="cta"><span class="nokta"></span>Odanda Dene</span>
  </div>
  <img src="https://deneme.ink/assets/products/12905905-3.jpg" alt="SOHO Berjer">
</a>
<script>
  var clickTag = window.clickTag || "https://deneme.ink/?urun=12905905";
  document.getElementById("tik").addEventListener("click", function (e) {
    e.preventDefault();
    window.open(window.clickTag || clickTag, "_blank");
  });
</script>
</body>
</html>
